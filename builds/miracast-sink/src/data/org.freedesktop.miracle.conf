<?xml version="1.0"?> <!--*-nxml-*-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
        "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  MiracleCast D-Bus policy (widened for the miracast-sink app).

  Base policy comes from MiracleCast's res/org.freedesktop.miracle.conf and
  grants read access to everyone plus full control to root. On top of that we
  allow the login user to drive the sink: enable scanning, advertise WFD
  capabilities, accept incoming peers and disconnect them.
-->

<busconfig>

        <policy user="root">
                <allow own="org.freedesktop.miracle"/>
                <allow own="org.freedesktop.miracle.wifi"/>
                <allow send_destination="org.freedesktop.miracle"/>
                <allow send_destination="org.freedesktop.miracle.wifi"/>
                <allow receive_sender="org.freedesktop.miracle"/>
                <allow receive_sender="org.freedesktop.miracle.wifi"/>
        </policy>

        <policy context="default">
                <deny send_destination="org.freedesktop.miracle"/>
                <deny send_destination="org.freedesktop.miracle.wifi"/>

                <!-- read access -->
                <allow send_destination="org.freedesktop.miracle"
                       send_interface="org.freedesktop.DBus.Introspectable"/>
                <allow send_destination="org.freedesktop.miracle.wifi"
                       send_interface="org.freedesktop.DBus.Introspectable"/>
                <allow send_destination="org.freedesktop.miracle"
                       send_interface="org.freedesktop.DBus.Peer"/>
                <allow send_destination="org.freedesktop.miracle.wifi"
                       send_interface="org.freedesktop.DBus.Peer"/>
                <allow send_destination="org.freedesktop.miracle"
                       send_interface="org.freedesktop.DBus.ObjectManager"/>
                <allow send_destination="org.freedesktop.miracle.wifi"
                       send_interface="org.freedesktop.DBus.ObjectManager"/>
                <allow send_destination="org.freedesktop.miracle"
                       send_interface="org.freedesktop.DBus.Properties"
                       send_member="Get"/>
                <allow send_destination="org.freedesktop.miracle.wifi"
                       send_interface="org.freedesktop.DBus.Properties"
                       send_member="Get"/>
                <allow send_destination="org.freedesktop.miracle"
                       send_interface="org.freedesktop.DBus.Properties"
                       send_member="GetAll"/>
                <allow send_destination="org.freedesktop.miracle.wifi"
                       send_interface="org.freedesktop.DBus.Properties"
                       send_member="GetAll"/>

                <allow receive_sender="org.freedesktop.miracle"/>
                <allow receive_sender="org.freedesktop.miracle.wifi"/>
        </policy>

        <!-- miracast-sink: control the sink (login user) -->
        <policy context="default">
                <allow send_destination="org.freedesktop.miracle.wifi"
                       send_interface="org.freedesktop.DBus.Properties"
                       send_member="Set"/>
                <allow send_destination="org.freedesktop.miracle.wifi"
                       send_interface="org.freedesktop.miracle.wifi.Link"/>
                <allow send_destination="org.freedesktop.miracle.wifi"
                       send_interface="org.freedesktop.miracle.wifi.Peer"/>
        </policy>

</busconfig>